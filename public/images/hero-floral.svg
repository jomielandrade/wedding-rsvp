<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8D9E6"/>
      <stop offset="35%" style="stop-color:#F0EDE8"/>
      <stop offset="70%" style="stop-color:#F8F6F3"/>
      <stop offset="100%" style="stop-color:#AFC4D3"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.85"/>
      <stop offset="55%" style="stop-color:#ffffff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="wash" cx="50%" cy="50%" r="75%">
      <stop offset="0%" style="stop-color:#AFC4D3;stop-opacity:0.28"/>
      <stop offset="100%" style="stop-color:#AFC4D3;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="cornerTL" cx="0%" cy="0%" r="55%">
      <stop offset="0%" style="stop-color:#7A9EBE;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#7A9EBE;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="cornerBR" cx="100%" cy="100%" r="55%">
      <stop offset="0%" style="stop-color:#7A9EBE;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7A9EBE;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#wash)"/>
  <rect width="1920" height="1080" fill="url(#cornerTL)"/>
  <rect width="1920" height="1080" fill="url(#cornerBR)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- Soft edge accents (corners only — no center symmetry) -->
  <g opacity="0.2" fill="#7A9EBE">
    <circle cx="120" cy="180" r="140"/>
    <circle cx="1800" cy="920" r="160"/>
    <circle cx="80" cy="920" r="90"/>
  </g>
  <g opacity="0.12" fill="#AFC4D3">
    <ellipse cx="1840" cy="200" rx="180" ry="120"/>
    <ellipse cx="960" cy="1040" rx="420" ry="100"/>
  </g>
</svg>
